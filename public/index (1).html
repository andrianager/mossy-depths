<script>
/* ===== Standalone multiplayer client: same API as the artifact "room", over WebSocket ===== */
(function(){
if(typeof claude!=='undefined'&&claude.use)return; // inside the artifact: use the built-in room
const code=(new URLSearchParams(location.search).get('room')||'lobby').toLowerCase();
let ws=null,myId=null,mine={},pend=null,flushT=0,snap=[],subs=[],retry=0,peersList=[];
const build=()=>{peersList=snap.map(s=>{const me=s.id===myId;return{peer:s.id,sameTab:me,isMe:me,kind:'viewer',guest:false,by:null,presence:me?mine:(s.p||{}),updatedAt:Date.now()}});
  if(myId&&!snap.some(s=>s.id===myId))peersList.push({peer:myId,sameTab:true,isMe:true,kind:'viewer',guest:false,by:null,presence:mine,updatedAt:Date.now()});};
const fire=()=>{build();subs.forEach(f=>{try{f({peers:peersList,joined:[],left:[],updated:[]})}catch(e){console.error(e)}})};
function open(){
  ws=new WebSocket((window.MOSSY_SERVER||((location.protocol==='https:'?'wss://':'ws://')+location.host))+'/ws?room='+encodeURIComponent(code));
  ws.onopen=()=>{retry=0;if(Object.keys(mine).length)ws.send(JSON.stringify({t:'p',d:mine}))};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='hi'){myId=m.id;fire()}else if(m.t==='s'){snap=m.peers||[];fire()}else if(m.t==='full'){alert('This room is full (max 8 players).')}};
  ws.onclose=()=>{myId=null;snap=[];fire();setTimeout(open,Math.min(8000,500*Math.pow(2,retry++)))};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
}
const flush=()=>{flushT=0;if(pend&&ws&&ws.readyState===1){ws.send(JSON.stringify({t:'p',d:pend}));pend=null}};
const room={
  presence(patch){for(const k in patch){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]}
    pend=Object.assign(pend||{},patch);if(!flushT)flushT=setTimeout(flush,33);build();return Promise.resolve()},
  onPeers(fn){subs.push(fn);setTimeout(()=>{build();try{fn({peers:peersList,joined:[],left:[],updated:[]})}catch(e){}},0);return()=>{subs=subs.filter(f=>f!==fn)}},
  peers(){return peersList},
  emit(){return Promise.resolve()},on(){return()=>{}},connected(){return !!(ws&&ws.readyState===1)}
};
window.claude={use:async n=>n==='room'?room:null};
open();
})();
</script>
<script>
/* ===== MOSSY DEPTHS MULTIPLAYER - Phase 2: party, joint teleport, shared dungeon map ===== */
(function(){
const MP=window.MP={room:null,peers:[],G:{},seed:null,gn:0,gnSeen:{},declined:new Set(),open:false,sig:''};
const lbOn=()=>{try{return !!LB}catch(e){return false}};
const myName=()=>{try{return String(PR.n||'Hero').replace(/[^\w \-]/g,'').slice(0,14)||'Hero'}catch(e){return 'Hero'}};
const mePeer=()=>MP.peers.find(p=>p.sameTab);
const byId=id=>MP.peers.find(p=>p.peer===id);
const inParty=()=>{const m=mePeer();return m&&m.presence.pid||null};
const members=pid=>pid?MP.peers.filter(p=>p.presence.pid===pid):[];
const nm=p=>String(p.presence.n||'Hero').slice(0,14)+' #'+p.peer.slice(-3);
const pres=o=>{if(MP.room)MP.room.presence(o).catch(()=>{})};
function send(){
  if(!MP.room||typeof P=='undefined'||!P)return;
  const w=EQ&&EQ.w,a=EQ&&EQ.a,L=lbOn();
  pres({g:1,lb:L?1:0,dg:L?0:1,dp:L?0:depth,bm:bossMode?1:0,x:Math.round(P.x),y:Math.round(P.y),f:P.f||1,mv:P.mv?1:0,an:+(P.an||0).toFixed(2),
    n:myName(),cls:CLS,wk:w?w.kind:null,wr:w?(w.r|0):0,wb:w&&w.basic?1:0,wc:w?w.c:null,ak:a?a.kind:null,ac:a?a.c:null});
}
/* ---------- ghosts ---------- */
let lastN=performance.now();
function layers(pred){
  const out=[],now=performance.now(),dt=Math.min(.1,(now-lastN)/1000);lastN=now;
  if(!MP.room)return out;
  for(const p of MP.peers){
    const s=p.presence;if(p.sameTab||!s||!s.g||typeof s.x!='number'||typeof s.y!='number'||!pred(p,s))continue;
    let q=MP.G[p.peer];if(!q)q=MP.G[p.peer]={x:s.x,y:s.y};
    if(Math.hypot(s.x-q.x,s.y-q.y)>200){q.x=s.x;q.y=s.y}
    const k=Math.min(1,dt*14);q.x+=(s.x-q.x)*k;q.y+=(s.y-q.y)*k;
    const mate=s.pid&&s.pid===inParty();
    out.push({y:q.y,f:()=>ghost(q,s,mate)});
  }
  return out;
}
MP.L=()=>lbOn()?layers((p,s)=>s.lb===1):[];
MP.LD=()=>{if(lbOn())return[];const pid=inParty();if(!pid)return[];
  return layers((p,s)=>s.dg===1&&s.pid===pid&&s.dp===depth&&(s.bm?1:0)===(bossMode?1:0))};
function ghost(q,s,mate){
  const sP=P,sW=EQ.w,sA=EQ.a,sC=CLS;
  try{
    P=Object.assign({},sP,{x:q.x,y:q.y,f:s.f==-1?-1:1,mv:s.mv,an:+s.an||0,inv:0,sw:0,sh:0,blk:0,stun:0});
    CLS=s.cls||'none';
    EQ.w=s.wk?{kind:s.wk,r:s.wr|0,basic:s.wb?1:0,c:s.wc||'#ccc',t:'w',v:0,x:{},q:0,n:'?'}:null;
    EQ.a=s.ak?{kind:s.ak,c:s.ac||'#888',t:'a',r:0,v:0,x:{},q:0,n:'?'}:null;
    shadow(q.x,q.y);heroDraw();
  }catch(e){}
  finally{P=sP;EQ.w=sW;EQ.a=sA;CLS=sC;g.globalAlpha=1}
  g.save();g.font='bold 7px monospace';g.textAlign='center';g.lineWidth=2;g.strokeStyle='#000';g.fillStyle=mate?'#ffe066':'#9fe8ff';
  const t=(mate?'* ':'')+String(s.n||'Hero').slice(0,14),tx=Math.round(q.x),ty=Math.round(q.y-36);
  g.strokeText(t,tx,ty);g.fillText(t,tx,ty);g.restore();
}
/* ---------- shared seed for the dungeon ---------- */
const hs=str=>{let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const mulb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const _gen=gen;
gen=function(){
  if(MP.seed==null||!inParty())return _gen.apply(this,arguments);
  const s=hs(MP.seed+':'+depth+':'+(bossMode?1:0)),R0=Math.random;
  Math.random=mulb(s);
  try{try{sd=(s%2147483646)+1}catch(e){}return _gen.apply(this,arguments)}finally{Math.random=R0}
};
/* ---------- joint teleport ---------- */
const _int=interact;
interact=function(fromE){
  const had=lbOn()&&LB.go,r=_int.apply(this,arguments);
  if(lbOn()&&LB.go&&!had){

function enterDungeon(seed){

  setTimeout(()=>{try{
    if(!lbOn())return;
    try{closeCls()}catch(e){}
    LB=null;restart();for(const k in keys)keys[k]=0;PT=[];DY=[];fx=[];TR=null;SHK=0;cardOpen=false;
    if(invOpen)toggleInv();if(shopOpen)closeShop();closeEnc();cv.style.transform='';
    if(typeof fadeIn=='function')fadeIn(900);
  }catch(e){console.error(e)}},450);
}
function stairs(pid){
  if(!pid||lbOn()||typeof TR=='undefined'||TR||!P||over)return;
  let best=null,bk=depth*2+(bossMode?1:0);
  for(const p of members(pid)){if(p.sameTab)continue;const s=p.presence;if(!s.dg)continue;const k=(s.dp|0)*2+(s.bm?1:0);if(k>bk){bk=k;best=s}}
  if(!best)return;

  startTr(bossMode?'blue':'dark',()=>{bossMode=tb;depth=td;P.hp=Math.min(P.max,P.hp+5);gen();sfx('descend');say('Your party moved on - Depth '+depth)});

/* ---------- party logic ---------- */
function invite(p){const m=mePeer();if(!m)return;const iv=(m.presence.iv||[]).filter(x=>x!==p.peer).concat(p.peer).slice(-6);
  pres({pid:m.presence.pid||m.peer,iv,ivn:(m.presence.ivn|0)+1})}

function accept(l){if(members(l.peer).length>=4){say('That party is full.');return}pres({pid:l.peer,iv:[]});say('Joined '+nm(l)+"'s party!")}
function leave(){pres({pid:null,iv:[]});MP.seed=null;say('You left the party.')}
function tick(){
  if(!MP.room)return;const m=mePeer();if(!m)return;
  const pid=m.presence.pid;
  if(pid&&pid!==m.peer){const l=byId(pid);if(!l||l.presence.pid!==pid){pres({pid:null});MP.seed=null;say('Your party was disbanded.')}}
  if(pid===m.peer){const old=m.presence.iv||[],iv=old.filter(id=>{const q=byId(id);return q&&q.presence.pid!==pid});if(iv.length!==old.length)pres({iv})}
  for(const p of MP.peers){
    if(p.sameTab)continue;const gn=p.presence.gn|0;
    if(!(p.peer in MP.gnSeen)){MP.gnSeen[p.peer]=gn;continue}
    if(gn!==MP.gnSeen[p.peer]){MP.gnSeen[p.peer]=gn;if(pid&&p.presence.pid===pid&&p.presence.gs!=null)enterDungeon(p.presence.gs)}
  }
  try{stairs(pid)}catch(e){console.error(e)}
  render();
}
/* ---------- UI ---------- */
const el=(t,css,txt)=>{const e=document.createElement(t);if(css)e.style.cssText=css;if(txt!=null)e.textContent=txt;return e};
const BTN='font:bold 11px monospace;background:#2a4a1c;color:#c8ffc0;border:1px solid #3c7a22;border-radius:3px;padding:2px 6px;margin-left:6px;cursor:pointer;';
const mkbtn=(t,fn,css)=>{const b=el('button',BTN+(css||''),t);b.onclick=e=>{e.stopPropagation();b.blur();fn()};return b};
const RED='background:#4a1c1c;color:#ffc0c0;border-color:#7a2222;';
function render(){
  const m=mePeer();if(!m)return;
  const pid=m.presence.pid,others=MP.peers.filter(p=>!p.sameTab&&p.presence.g);
  const incoming=others.filter(p=>(p.presence.iv||[]).includes(m.peer)&&p.presence.pid===p.peer&&!pid&&!MP.declined.has(p.peer+':'+(p.presence.ivn|0)));
  const sig=JSON.stringify([MP.open,pid,m.presence.iv,others.map(p=>[p.peer,p.presence.n,p.presence.pid,p.presence.ivn]),incoming.map(p=>p.peer)]);
  if(sig===MP.sig)return;MP.sig=sig;
  let root=document.getElementById('mpui');
  if(!root){root=el('div','position:fixed;top:6px;right:8px;z-index:50;font:12px monospace;color:#e8ffe0;text-align:right');document.body.appendChild(root)}
  root.textContent='';
  const top=mkbtn('PARTY ('+(others.length+1)+' online)'+(pid?' *':''),()=>{MP.open=!MP.open;MP.sig=''},'margin:0;padding:3px 8px;background:rgba(0,0,0,.6);');
  root.appendChild(top);
  if(MP.open){
    const box=el('div','margin-top:4px;background:rgba(10,18,8,.92);border:1px solid #3c7a22;border-radius:4px;padding:6px 8px;min-width:230px;text-align:left');
    if(pid){
      box.appendChild(el('div','color:#ffe066;margin-bottom:3px','Your party:'));

      const r=el('div','margin:4px 0 6px');r.appendChild(mkbtn('LEAVE PARTY',leave,RED+'margin:0;'));box.appendChild(r);
    }
    box.appendChild(el('div','color:#9fe8ff;margin-bottom:3px','Players online:'));
    if(!others.length)box.appendChild(el('div','color:#8a9a80','Nobody else here yet. Open the game in another tab or invite a friend.'));
    for(const p of others){
      const row=el('div','margin:2px 0;display:flex;justify-content:space-between;align-items:center',nm(p));
      const mine=pid&&p.presence.pid===pid,pend=(m.presence.iv||[]).includes(p.peer);
      if(mine)row.appendChild(el('span','color:#ffe066;margin-left:8px','in party'));
      else if(p.presence.pid)row.appendChild(el('span','color:#8a9a80;margin-left:8px','in a party'));

}
(async function init(){
